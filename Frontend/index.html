<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="QiyasAI - Intelligent Compliance & Regulations Assistant powered by AI" />
  <meta name="theme-color" content="#0f1629" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>QiyasAI - Intelligent Compliance Assistant</title>
</head>

<body>
  <script>
    // Prevent flash of incorrect theme and direction.
    (function() {
      var theme = localStorage.getItem('theme') || 'dark';
      if (theme === 'dark') document.documentElement.classList.add('dark');
      var locale = localStorage.getItem('locale') || (navigator.language && navigator.language.toLowerCase().startsWith('ar') ? 'ar' : 'en');
      var normalized = locale.toLowerCase().startsWith('ar') ? 'ar' : 'en';
      document.documentElement.setAttribute('lang', normalized);
      document.documentElement.setAttribute('dir', normalized === 'ar' ? 'rtl' : 'ltr');
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/Source/main.jsx"></script>
</body>

</html>
