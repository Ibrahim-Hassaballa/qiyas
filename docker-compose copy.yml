services:
  postgres:
    image: postgres:16-alpine
    container_name: qiyasai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: qiyasai
      POSTGRES_USER: qiyas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-QiyasAI_2025!}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - qiyasai-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U qiyas -d qiyasai" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: qiyasai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - qiyasai-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    container_name: qiyasai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql://qiyas:${POSTGRES_PASSWORD:-QiyasAI_2025!}@postgres:5432/qiyasai
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - ./Backend/.env
    volumes:
      # Persistent data storage
      - ./Data:/app/Data
      - ./Logs:/app/logs
      # ChromaDB persistence
      - qiyasai-chromadb:/app/Data/KnowledgeBase
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - qiyasai-network
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: qiyasai-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - qiyasai-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  qiyasai-network:
    driver: bridge

volumes:
  qiyasai-chromadb:
    driver: local
  pgdata:
    driver: local
